<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Status layanan Payoung</title>
<meta name="description" content="Kondisi layanan Payoung saat ini dan riwayat gangguan 30 hari terakhir.">
<style>
/*
 * Halaman status statis Payoung (P-11 PGL-21). Berdiri sendiri supaya tetap hidup di hosting terpisah saat server utama
 * bermasalah: hanya membaca `status.json` di folder yang sama (dibuat `php artisan status:ekspor`). Nilai warna di bawah
 * HARUS sama dengan token di resources/js/Gaya/Aplikasi.css (dijaga StatusPlatformTes). Tanpa pustaka luar, tanpa
 * penyedia analitik, semua teks dari JSON ditulis lewat textContent (tanpa HTML).
 */
:root {
    --latar: #f7f9f6;
    --permukaan: #ffffff;
    --garis: #e8ece9;
    --teks-utama: #1f3335;
    --teks-sekunder: #4f6567;
    --brand: #3b5b5d;
    --brand-gelap: #22383a;
    --sukses: #2e7d32;
    --peringatan: #9a5b00;
    --bahaya: #b3261e;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--latar); color: var(--teks-utama); font: 16px/1.5 "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif; }
header { background: var(--brand-gelap); color: var(--permukaan); padding: 20px 16px; }
header div, main { max-width: 760px; margin: 0 auto; }
header h1 { margin: 0; font-size: 1.25rem; }
main { padding: 16px; display: flex; flex-direction: column; gap: 20px; }
.ringkas { background: var(--permukaan); border: 1px solid var(--garis); border-left: 6px solid var(--sukses); border-radius: 8px; padding: 16px; }
.ringkas.Sebagian { border-left-color: var(--peringatan); }
.ringkas.Besar { border-left-color: var(--bahaya); }
.ringkas h2 { margin: 0 0 4px; font-size: 1.125rem; }
.kecil { color: var(--teks-sekunder); font-size: .875rem; margin: 0; }
section h2 { font-size: 1.125rem; margin: 0 0 8px; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
li.kartu { background: var(--permukaan); border: 1px solid var(--garis); border-radius: 8px; padding: 12px 16px; }
.baris { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.label { font-weight: 700; }
.Normal { color: var(--sukses); }
.Sebagian { color: var(--peringatan); }
.Besar { color: var(--bahaya); }
.pembaruan { margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--garis); display: flex; flex-direction: column; gap: 6px; }
.pembaruan p { margin: 0; }
details { margin-top: 8px; }
summary { cursor: pointer; font-weight: 700; }
pre { white-space: pre-wrap; margin: 8px 0 0; font: inherit; }
footer { max-width: 760px; margin: 0 auto; padding: 8px 16px 32px; }
</style>
</head>
<body>
<header><div><h1>Status layanan Payoung</h1></div></header>
<main id="isi" aria-live="polite">
    <p class="kecil" id="memuat">Memuat status layanan…</p>
</main>
<footer><p class="kecil" id="diperbarui"></p></footer>
<script>
(function () {
    'use strict';
    var isi = document.getElementById('isi');
    function el(nama, kelas, teks) {
        var e = document.createElement(nama);
        if (kelas) { e.className = kelas; }
        if (teks !== undefined && teks !== null) { e.textContent = teks; }
        return e;
    }
    function waktu(iso) {
        if (!iso) { return ''; }
        try {
            return new Date(iso).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
        } catch (e) { return iso; }
    }
    function kartuInsiden(i) {
        var k = el('li', 'kartu');
        var b = el('div', 'baris');
        b.appendChild(el('span', 'label', i.Judul));
        b.appendChild(el('span', 'kecil', i.LabelStatus));
        k.appendChild(b);
        k.appendChild(el('p', 'kecil', 'Mulai ' + waktu(i.MulaiPada) + (i.SelesaiPada ? ' | selesai ' + waktu(i.SelesaiPada) : '') + ' | ' + i.Komponen.join(', ')));
        k.appendChild(el('p', null, i.Dampak));
        var p = el('div', 'pembaruan');
        i.Pembaruan.forEach(function (u) {
            var baris = el('p');
            baris.appendChild(el('strong', null, u.LabelStatus + ' (' + waktu(u.Waktu) + '): '));
            baris.appendChild(document.createTextNode(u.Isi));
            p.appendChild(baris);
        });
        k.appendChild(p);
        if (i.PostMortem) {
            var d = el('details');
            d.appendChild(el('summary', null, 'Post-mortem'));
            d.appendChild(el('pre', null, i.PostMortem));
            k.appendChild(d);
        }
        return k;
    }
    function gambar(s) {
        isi.textContent = '';
        var ringkas = el('div', 'ringkas ' + s.Keseluruhan);
        ringkas.appendChild(el('h2', null, s.LabelKeseluruhan));
        isi.appendChild(ringkas);

        var bagianKomponen = el('section');
        bagianKomponen.appendChild(el('h2', null, 'Komponen'));
        var daftarKomponen = el('ul');
        s.Komponen.forEach(function (k) {
            var li = el('li', 'kartu baris');
            li.appendChild(el('span', null, k.Nama));
            li.appendChild(el('span', 'label ' + k.Kondisi, k.LabelKondisi));
            daftarKomponen.appendChild(li);
        });
        bagianKomponen.appendChild(daftarKomponen);
        isi.appendChild(bagianKomponen);

        var aktif = el('section');
        aktif.appendChild(el('h2', null, 'Gangguan yang sedang berjalan'));
        if (s.Aktif.length === 0) { aktif.appendChild(el('p', 'kecil', 'Tidak ada gangguan saat ini.')); }
        else { var la = el('ul'); s.Aktif.forEach(function (i) { la.appendChild(kartuInsiden(i)); }); aktif.appendChild(la); }
        isi.appendChild(aktif);

        var riwayat = el('section');
        riwayat.appendChild(el('h2', null, 'Riwayat 30 hari terakhir'));
        if (s.Riwayat.length === 0) { riwayat.appendChild(el('p', 'kecil', 'Tidak ada gangguan dalam 30 hari terakhir.')); }
        else { var lr = el('ul'); s.Riwayat.forEach(function (i) { lr.appendChild(kartuInsiden(i)); }); riwayat.appendChild(lr); }
        isi.appendChild(riwayat);

        document.getElementById('diperbarui').textContent = 'Diperbarui ' + waktu(s.DiperbaruiPada) + '. Halaman ini memuat ulang sendiri tiap menit.';
    }
    function muat() {
        fetch('status.json', { cache: 'no-store' })
            .then(function (r) { if (!r.ok) { throw new Error('http'); } return r.json(); })
            .then(gambar)
            .catch(function () {
                if (!document.getElementById('memuat')) { return; }
                document.getElementById('memuat').textContent = 'Status belum bisa dimuat. Coba lagi sebentar lagi.';
            });
    }
    muat();
    setInterval(muat, 60000);
})();
</script>
</body>
</html>
